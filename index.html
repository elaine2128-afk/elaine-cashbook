<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Elaine Tan♡ Cashbook</title>
<style>
:root{
  --pink:#f5a9c4; --pink2:#fff0f6; --deep:#d85b88; --text:#4d3b43;
  --white:#fff; --line:#f0d8e2; --green:#72b58a; --red:#d65f6f;
}
*{box-sizing:border-box}
body{margin:0;background:#fff7fa;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{border:0}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{background:linear-gradient(180deg,#fff,#fff1f6);padding:18px 16px 14px;text-align:center;border-bottom:1px solid var(--line)}
.logo img{display:block;width:220px;max-width:78%;height:auto;margin:0 auto}
.name{font-family:cursive;font-size:25px;color:#d85b88;margin-top:4px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#fff}
.nav button{background:#fff0f6;color:#b94b76;border-radius:12px;padding:10px 4px;font-size:12px;font-weight:700}
.nav button.active{background:#e987ad;color:white}
.page{display:none;padding:14px}.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #eaa5bd20}
h2{font-size:18px;margin:2px 0 12px;color:#a94269}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:#9b7381;margin-bottom:5px;font-weight:700}
input,select{width:100%;border:1px solid var(--line);background:#fffafd;border-radius:11px;padding:11px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--pink)}
.type{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.type button{padding:11px;border-radius:12px;background:#f8e8ee;color:#9a6477;font-weight:700}
.type button.sel.income{background:#e8f6ec;color:#4d9765}.type button.sel.expense{background:#ffe5ec;color:#c74c70}
.primary{width:100%;background:#e987ad;color:white;border-radius:12px;padding:12px;font-weight:800;margin-top:8px}
.secondary{background:#fff0f6;color:#b94b76;padding:9px 12px;border-radius:10px;font-weight:700}
.danger{background:#fff0f2;color:#c44c5f;padding:8px 10px;border-radius:9px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.currency-row{margin-bottom:12px}.currency-title{font-weight:800;color:#d85b88;margin:4px 0 6px}.currency-row .summary{margin:0}
.stat{padding:13px;border-radius:15px;background:#fff4f8;border:1px solid var(--line)}
.stat small{color:#9b7381}.stat strong{display:block;font-size:20px;margin-top:3px}
.incomeTxt{color:var(--green)}.expenseTxt{color:var(--red)}
.ratebox{background:#fff7dc;border:1px solid #f0df9a;border-radius:12px;padding:10px;margin-top:8px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.entries{margin-top:10px}
.entry{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px;background:white}
.entry .amt{font-size:17px;font-weight:800}
.entry .meta{font-size:11px;color:#9b7c87;margin-top:3px}
.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px 4px;border-bottom:1px solid #f0e1e7;text-align:left}th{color:#a64d6e;background:#fff1f6}
.printArea{background:#fff;margin:auto}
.reportHeader{text-align:center;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px}
.reportLogo img{display:block;width:150px;max-width:85%;height:auto;margin:0 auto}.reportName{font-family:cursive;font-size:20px;color:#d85b88}
.quote{text-align:center;margin-top:14px;font-weight:700;color:#777;font-size:12px}
.empty{text-align:center;color:#aaa;padding:20px}
.small{font-size:11px;color:#9b7c87}
@media(min-width:700px){body{padding:20px}.app{box-shadow:0 0 30px #dca0b620;border-radius:20px;overflow:hidden}}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.keypad button{background:#fff0f6;border:1px solid var(--line);color:#b94b76;border-radius:13px;padding:13px 0;font-size:20px;font-weight:800}
.keypad button:active{background:#e987ad;color:#fff;transform:scale(.98)}
.keypad .wide{grid-column:span 2}
.keypad .clear{background:#fff0f2;color:#c44c5f}

.deleteModal{display:none;position:fixed;inset:0;background:rgba(55,35,45,.38);z-index:9999;align-items:center;justify-content:center;padding:20px}
.deleteModal.show{display:flex}
.deleteBox{width:min(330px,100%);background:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.18)}
.deleteIcon{font-size:34px}.deleteBox h3{margin:7px 0 5px;color:#a94269}.deleteBox p{margin:0 0 18px;color:#8b6c77;font-size:13px}
.deleteActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.deleteActions button{padding:11px;border-radius:11px;font-weight:800}
.cancelDelete{background:#fff0f6;color:#a94269}.confirmDelete{background:#d65f6f;color:#fff}

.printModal{display:none;position:fixed;inset:0;background:rgba(55,35,45,.42);z-index:10000;padding:10px}
.printModal.show{display:flex;align-items:center;justify-content:center}
.printBox{width:min(96vw,900px);height:min(94vh,900px);background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.printTop{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff0f6;color:#a94269;border-bottom:1px solid var(--line)}
.printTop button{background:#fff;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;color:#a94269}
.printReport{flex:1;overflow:auto;padding:14px;background:#f7f5f6}
.printPaper{background:#fff;margin:auto;padding:10px}
.printReport.daily .printPaper{width:80mm}
.printReport.monthly .printPaper{width:150mm;min-height:210mm}
.printActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}
.printActions button{border:0;border-radius:11px;padding:12px;font-weight:800}
.popupPrint{background:#e987ad;color:#fff}.popupShare{background:#fff0f6;color:#a94269}.popupClose{background:#f4f1f2;color:#6d5961}
@media print{
 body>*{display:none!important}
 #printModal{display:block!important;position:static!important;background:#fff!important;padding:0!important}
 #printModal .printBox{display:block!important;width:auto!important;height:auto!important;box-shadow:none!important}
 #printModal .printTop,#printModal .printActions{display:none!important}
 #printModal .printReport{display:block!important;overflow:visible!important;padding:0!important;background:#fff!important}
 #printModal .printPaper{box-shadow:none!important;margin:0 auto!important}
}

.deleteModal{display:none;position:fixed;inset:0;background:rgba(55,35,45,.38);z-index:9999;align-items:center;justify-content:center;padding:20px}
.deleteModal.show{display:flex}.deleteBox{width:min(330px,100%);background:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.18)}
.deleteIcon{font-size:34px}.deleteBox h3{margin:7px 0 5px;color:#a94269}.deleteBox p{margin:0 0 18px;color:#8b6c77;font-size:13px}.deleteActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.deleteActions button{padding:11px;border-radius:11px;font-weight:800}.cancelDelete{background:#fff0f6;color:#a94269}.confirmDelete{background:#d65f6f;color:#fff}
</style>
</head>

  '账单':['SHOPEE（SG）','GrabPayLater（MY）','话费','其它'],
  '购物':['衣服','包包','鞋子','美容美甲','化妆品护肤品','其它']
};
let entries=JSON.parse(localStorage.getItem('elaineCashbookEntries')||'[]');
let exchanges=JSON.parse(localStorage.getItem('elaineCashbookExchanges')||'[]');
let type='income',editId=null;

function pad(n){return String(n).padStart(2,'0')}
function today(){let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function nowTime(){let d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function save(){localStorage.setItem('elaineCashbookEntries',JSON.stringify(entries));renderAll()}
function showPage(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
 if(id==='daily')renderDaily(); if(id==='monthly')renderMonthly(); if(id==='add')renderAllEntries(); if(id==='exchange')renderExchangeEntries();
}
function setType(t){type=t;document.getElementById('incomeBtn').className=t==='income'?'sel income':'';document.getElementById('expenseBtn').className=t==='expense'?'sel expense':''}
function populate(){
 document.getElementById('date').value=today();document.getElementById('time').value=nowTime();
 document.getElementById('dailyDate').value=today();
 let m=today().slice(0,7);document.getElementById('month').value=m;
 document.getElementById('payment').innerHTML=PAYMENTS.map(x=>`<option>${x}</option>`).join('');
 document.getElementById('category').innerHTML=Object.keys(CATS).map(x=>`<option>${x}</option>`).join('');
 loadSubcategories();
 document.getElementById('exDate').value=today();
 document.getElementById('exFrom').innerHTML=PAYMENTS.map(x=>`<option>${x}</option>`).join('');
 document.getElementById('exTo').innerHTML=PAYMENTS.map(x=>`<option>${x}</option>`).join('');
 updateExchangeResult();
}
function loadSubcategories(){
 let c=document.getElementById('category').value;
 document.getElementById('subcategory').innerHTML=(CATS[c]||['']).map(x=>`<option>${x}</option>`).join('');
}
function keypadPress(v){
  const el=document.getElementById('amount');
  let s=el.value||'';
  if(v==='.' && s.includes('.')) return;
  if(v==='.' && s==='') s='0';
  if(s.includes('.') && s.split('.')[1].length>=2) return;
  if(s==='0' && v!==' .'.trim()) s='';
  el.value=s+v;
}
function keypadClear(){
  const el=document.getElementById('amount');
  el.value=(el.value||'').slice(0,-1);
}
function exKeypad(v){
  const el=document.getElementById('exAmount');
  let s=el.value||'';
  if(v==='.' && s.includes('.')) return;
  if(v==='.' && s==='') s='0';
  if(s.includes('.') && s.split('.')[1].length>=2) return;
  if(s==='0') s='';
  el.value=s+v;
  updateExchangeResult();
}
function exKeypadClear(){
  const el=document.getElementById('exAmount');
  el.value=(el.value||'').slice(0,-1);
  updateExchangeResult();
}
function updateExchangeResult(){
  const a=Number(document.getElementById('exAmount')?.value)||0;
  const r=Number(document.getElementById('exRate')?.value)||0;
  const result=a*r;
  const box=document.getElementById('exchangeResult');
  if(box) box.textContent=`兑换后：${result.toFixed(2)}`;
}
document.getElementById('currency').addEventListener('change',()=>{});
document.getElementById('exRate').addEventListener('input',updateExchangeResult);

function saveEntry(){
 let amount=Number(document.getElementById('amount').value);
 if(!amount){alert('请输入金额');return}
 let obj={id:editId||crypto.randomUUID(),no:editId?(entries.find(x=>x.id===editId)?.no):'Elaine'+Math.floor(10000+Math.random()*90000),
 type,date:document.getElementById('date').value,time:document.getElementById('time').value,amount,
 currency:document.getElementById('currency').value,payment:document.getElementById('payment').value,
 category:document.getElementById('category').value,subcategory:document.getElementById('subcategory').value,
 remark:document.getElementById('remark').value};
 if(editId) entries=entries.map(x=>x.id===editId?obj:x); else entries.unshift(obj);
 save();resetForm();alert(editId?'已更新记录':'已保存记录');
}
function resetForm(){
 editId=null;document.getElementById('formTitle').textContent='➕ 新增记录';document.getElementById('cancelEdit').style.display='none';
 document.getElementById('amount').value='';document.getElementById('remark').value='';document.getElementById('date').value=today();document.getElementById('time').value=nowTime();setType('income')
}
function editEntry(id){
 let e=entries.find(x=>x.id===id);if(!e)return;editId=id;
 document.getElementById('formTitle').textContent='✏️ 编辑记录';document.getElementById('cancelEdit').style.display='block';
 setType(e.type);document.getElementById('date').value=e.date;document.getElementById('time').value=e.time;document.getElementById('amount').value=e.amount;
 document.getElementById('currency').value=e.currency;document.getElementById('payment').value=e.payment;document.getElementById('category').value=e.category;loadSubcategories();document.getElementById('subcategory').value=e.subcategory;document.getElementById('remark').value=e.remark
 window.scrollTo({top:0,behavior:'smooth'});
}
function deleteEntry(id){
  const e=entries.find(x=>x.id===id);
  if(!e)return;
  openDeleteModal(id, e.no, 'entry');
}
function money(e,to){ return Number(e.amount)||0; }
function sumCurrency(list,currency,type){
  return list.filter(e=>(e.currency||'SGD')===currency && (!type || e.type===type)).reduce((s,e)=>s+money(e),0);
}

let deleteTargetId=null, deleteTargetType=null;
function openDeleteModal(id,no,type){
  deleteTargetId=id; deleteTargetType=type;
  document.getElementById('deleteMessage').textContent=`确定要删除 ${no} 这笔记录吗？`;
  const m=document.getElementById('deleteModal');
  m.classList.add('show'); m.setAttribute('aria-hidden','false');
}
function closeDeleteModal(){
  deleteTargetId=null; deleteTargetType=null;
  const m=document.getElementById('deleteModal');
  m.classList.remove('show'); m.setAttribute('aria-hidden','true');
}
function confirmDelete(){
  if(!deleteTargetId)return;
  if(deleteTargetType==='entry'){
    entries=entries.filter(x=>x.id!==deleteTargetId);
    localStorage.setItem('elaineCashbookEntries',JSON.stringify(entries));
  }else{
    exchanges=exchanges.filter(x=>x.id!==deleteTargetId);
    localStorage.setItem('elaineCashbookExchanges',JSON.stringify(exchanges));
  }
  closeDeleteModal();
  renderAll();
}

function renderAllEntries(){
 let box=document.getElementById('allEntries');
 if(!entries.length){box.innerHTML='<div class="empty">还没有记录</div>';return}
 box.innerHTML=entries.map(e=>`<div class="entry">
  <div class="row"><strong>${e.type==='income'?'收入':'支出'} · ${e.category}</strong><span class="amt ${e.type==='income'?'incomeTxt':'expenseTxt'}">${e.currency} ${e.amount.toFixed(2)}</span></div>
  <div class="meta">${e.no} · ${e.date} ${e.time} · ${e.subcategory} · ${e.payment}${e.remark?' · '+e.remark:''}</div>
  <div class="actions"><button type="button" class="secondary" onclick="editEntry('${e.id}')">编辑</button><button type="button" class="danger" onclick="deleteEntry('${e.id}')">删除</button></div>
 </div>`).join('');
}

function saveExchange(){
  const amount=Number(document.getElementById('exAmount').value)||0;
  const from=document.getElementById('exFrom').value;
  const to=document.getElementById('exTo').value;
  const exchangeRate=Number(document.getElementById('exRate').value)||0;
  if(!amount){alert('请输入兑换金额');return}
  if(from===to){alert('从哪里和到哪里不能一样');return}
  if(!exchangeRate){alert('请输入汇率');return}
  const received=amount*exchangeRate;
  const obj={
    id:crypto.randomUUID(),
    date:document.getElementById('exDate').value,
    from,to,amount,exchangeRate,received
  };
  exchanges.unshift(obj);
  localStorage.setItem('elaineCashbookExchanges',JSON.stringify(exchanges));
  document.getElementById('exAmount').value='';
  document.getElementById('exRate').value='';
  updateExchangeResult();
  renderExchangeEntries();
  alert('兑换记录已保存');
}
function deleteExchange(id){
  const e=exchanges.find(x=>x.id===id);
  if(!e)return;
  openDeleteModal(id, e.no, 'exchange');
}
function renderExchangeEntries(){
  const box=document.getElementById('exchangeEntries');
  if(!box)return;
  if(!exchanges.length){box.innerHTML='<div class="empty">还没有兑换记录</div>';return}
  box.innerHTML=exchanges.map(e=>`<div class="entry">
    <div class="row"><strong>${e.from} → ${e.to}</strong><span class="amt">${Number(e.amount).toFixed(2)} → ${Number(e.received).toFixed(2)}</span></div>
    <div class="meta">${e.date} · 汇率 ${Number(e.exchangeRate).toFixed(4)}</div>
    <div class="actions"><button type="button" class="danger" onclick="deleteExchange('${e.id}')">删除</button></div>
  </div>`).join('');
}

function renderHome(){
 let m=today().slice(0,7), es=entries.filter(e=>e.date.startsWith(m));
 let incSGD=sumCurrency(es,'SGD','income'), expSGD=sumCurrency(es,'SGD','expense');
 let incRM=sumCurrency(es,'RM','income'), expRM=sumCurrency(es,'RM','expense');
 document.getElementById('homeIncomeSGD').textContent=`SGD ${incSGD.toFixed(2)}`;
 document.getElementById('homeExpenseSGD').textContent=`SGD ${expSGD.toFixed(2)}`;
 document.getElementById('homeBalanceSGD').textContent=`SGD ${(incSGD-expSGD).toFixed(2)}`;
 document.getElementById('homeIncomeRM').textContent=`RM ${incRM.toFixed(2)}`;
 document.getElementById('homeExpenseRM').textContent=`RM ${expRM.toFixed(2)}`;
 document.getElementById('homeBalanceRM').textContent=`RM ${(incRM-expRM).toFixed(2)}`;
 document.getElementById('homeCount').textContent=es.length;
 let r=entries.slice(0,5);document.getElementById('recent').innerHTML=r.length?r.map(e=>`<div class="entry"><div class="row"><span>${e.category} · ${e.subcategory}</span><b class="${e.type==='income'?'incomeTxt':'expenseTxt'}">${e.type==='income'?'+':'-'} ${e.currency} ${e.amount.toFixed(2)}</b></div><div class="meta">${e.date} · ${e.payment}</div></div>`).join(''):'<div class="empty">还没有记录</div>';
}

let currentPrintType='daily';
let currentPrintTitle='';

function openPrintPopup(content,type,title){
  currentPrintType=type;
  currentPrintTitle=title;
  const modal=document.getElementById('printModal');
  const report=document.getElementById('printReport');
  const paper=document.createElement('div');
  paper.className='printPaper';
  paper.innerHTML=content;
  report.className='printReport '+type;
  report.replaceChildren(paper);
  document.getElementById('printTitle').textContent=title+' · 打印预览';
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}

function closePrintPopup(){
  const modal=document.getElementById('printModal');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

function doPrint(){
  window.print();
}

async function shareCurrentReport(){
  const report=document.getElementById('printReport');
  const text=report ? report.innerText : '';
  try{
    if(navigator.share){
      await navigator.share({
        title: currentPrintTitle || 'Elaine Tan Cashbook',
        text: text
      });
    }else{
      alert('这个浏览器不支持系统分享。请使用 iPhone 的分享功能。');
    }
  }catch(err){
    if(!err || err.name!=='AbortError') alert('分享没有完成。');
  }
}

function renderDaily(){
 let date=document.getElementById('dailyDate').value||today(),es=dailyData(date);
 let incSGD=sumCurrency(es,'SGD','income'),expSGD=sumCurrency(es,'SGD','expense');
 let incRM=sumCurrency(es,'RM','income'),expRM=sumCurrency(es,'RM','expense');
 let rows=es.map(e=>`<tr><td>${e.time}</td><td>${e.category}<br>${e.subcategory}</td><td>${e.payment}</td><td>${e.currency} ${e.amount.toFixed(2)}</td></tr>`).join('');
 document.getElementById('dailyPreview').innerHTML=`<div class="printArea">${reportHead('DAILY CASHBOOK',date)}<table><tr><th>时间</th><th>分类</th><th>付款</th><th>金额</th></tr>${rows||'<tr><td colspan="4" class="empty">当天没有记录</td></tr>'}</table><hr><h4>🇸🇬 SGD</h4><div class="row"><b>收入</b><b class="incomeTxt">SGD ${incSGD.toFixed(2)}</b></div><div class="row"><b>开销</b><b class="expenseTxt">SGD ${expSGD.toFixed(2)}</b></div><div class="row"><b>结余</b><b>SGD ${(incSGD-expSGD).toFixed(2)}</b></div><h4>🇲🇾 RM</h4><div class="row"><b>收入</b><b class="incomeTxt">RM ${incRM.toFixed(2)}</b></div><div class="row"><b>开销</b><b class="expenseTxt">RM ${expRM.toFixed(2)}</b></div><div class="row"><b>结余</b><b>RM ${(incRM-expRM).toFixed(2)}</b></div><div class="quote">你不理财 财不理你</div></div>`;
}
function renderMonthly(){
 let month=document.getElementById('month').value||today().slice(0,7),es=entries.filter(e=>e.date.startsWith(month));
 let incSGD=sumCurrency(es,'SGD','income'),expSGD=sumCurrency(es,'SGD','expense');
 let incRM=sumCurrency(es,'RM','income'),expRM=sumCurrency(es,'RM','expense');
 let catsSGD={},paysSGD={},catsRM={},paysRM={};
 es.filter(e=>e.type==='expense').forEach(e=>{
   const cur=e.currency||'SGD';
   const cats=cur==='RM'?catsRM:catsSGD; const pays=cur==='RM'?paysRM:paysSGD;
   cats[e.category]=(cats[e.category]||0)+money(e); pays[e.payment]=(pays[e.payment]||0)+money(e);
 });
 const makeRows=(obj,cur)=>Object.entries(obj).map(([k,v])=>`<tr><td>${k}</td><td>${cur} ${v.toFixed(2)}</td></tr>`).join('');
 const section=(cur,inc,exp,cats,pays)=>`<h4>${cur==='SGD'?'🇸🇬 SGD':'🇲🇾 RM'}</h4><table><tr><th>项目</th><th>${cur}</th></tr><tr><td>总收入</td><td class="incomeTxt">${cur} ${inc.toFixed(2)}</td></tr><tr><td>总开销</td><td class="expenseTxt">${cur} ${exp.toFixed(2)}</td></tr><tr><td><b>收入 - 开销</b></td><td><b>${cur} ${(inc-exp).toFixed(2)}</b></td></tr></table><h4>分类开销</h4><table><tr><th>分类</th><th>金额</th></tr>${makeRows(cats,cur)||'<tr><td colspan="2">没有记录</td></tr>'}</table><h4>付款方式开销</h4><table><tr><th>付款方式</th><th>金额</th></tr>${makeRows(pays,cur)||'<tr><td colspan="2">没有记录</td></tr>'}</table>`;
 document.getElementById('monthlyPreview').innerHTML=`<div class="printArea">${reportHead('MONTHLY CASHBOOK',month)}${section('SGD',incSGD,expSGD,catsSGD,paysSGD)}${section('RM',incRM,expRM,catsRM,paysRM)}<div class="quote">你不理财 财不理你</div></div>`;
}
function printDaily(){ openPrintPopup(document.getElementById('dailyPreview').innerHTML,'daily','每日现金簿'); }
function printMonthly(){ openPrintPopup(document.getElementById('monthlyPreview').innerHTML,'monthly','每月现金簿'); }
populate();renderAll();updateExchangeResult();


</script>

      <button type="button" class="popupShare" onclick="shareCurrentReport()">📤 分享</button>
      <button type="button" class="popupClose" onclick="closePrintPopup()">✕ 关闭</button>

</div>
